name: Deploy

on:
  push:
    branches: [main] # main ONLY — never a claude/** glob (playbook §11.1)
  pull_request:
    branches: [main] # verify gates the PR too; deploy is skipped below
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # let an in-flight deploy finish

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci # requires the committed lockfile
      - run: npm run lint # must be green — `npm run build` does not run ESLint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          PAGES: '1'
      - run: test -s dist/index.html # smoke: the bundle isn't empty
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: verify # the gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
