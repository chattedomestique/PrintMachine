name: Deploy

on:
  push:
    branches: [main] # main ONLY — never a claude/** glob (playbook §11.1)
  pull_request:
    branches: [main] # verify gates the PR too; deploy is skipped below
  workflow_dispatch:

# `contents: write` is needed to push the built site to the gh-pages branch.
# This is a deliberate deviation from playbook §11.2, which prefers the OIDC
# Pages pipeline precisely to avoid this scope — see the README. The reason is
# consistency: every other PWA in this collection publishes to gh-pages and has
# its Pages source set to that branch, and one deployment model across all of
# them is worth more here than the narrower token.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false # let an in-flight deploy finish

jobs:
  # The steps of this job are gates, run in this order on the one PAGES=1
  # build `npm run verify` makes (measure-export, informational, and the
  # upload aside), and the job is meant to be REQUIRED: a pull request into
  # main should not merge until `verify` is green. That takes branch
  # protection on main with `verify` as a required check, a switch in the
  # repository's settings that only its owner can flip; until it is on,
  # nothing stops a direct push to main, and this job is advice.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci # requires the committed lockfile
      # One script, so "the gate is green" means the same thing locally as it
      # does here. Running the steps separately let a typecheck failure through
      # once, because `npm test` transpiles without type-checking and looked
      # like proof the whole chain passed.
      - run: npm run verify
        env:
          PAGES: '1' # base = /PrintMachine/ for the Pages sub-path
      - run: test -s dist/index.html # smoke: the bundle isn't empty

      # N2 says "works offline" is a claim you must verify. It was previously
      # verified by reading the precache manifest and deciding it looked right,
      # which is inspection, not verification. This serves the build at the real
      # Pages sub-path, installs the worker, cuts the network and cold-launches.
      # It also holds the precache to its budget (23 entries, 1.12 MiB), which
      # a phone downloads whole before the app opens offline.
      # Runners ship Chrome, which playwright-core drives without downloading
      # a browser.
      - run: node scripts/verify-offline.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome

      # The dock holds still and the style guide's measurable rules hold, in
      # the built app at four phone widths: the sheet's rectangle in every
      # tool and tab, no panel overflow, every target owning 44px, nothing
      # cut off at 200% text, the app bar one row at every width.
      - run: node scripts/verify-geometry.mjs
        env:
          PAGES: '1' # serve dist/ at the base it was built for
          CHROMIUM_PATH: /usr/bin/google-chrome

      # "No down-rezzing at all" is a claim, so it is measured. The memory
      # gate: the real export path in node with every typed array counted
      # (an iPhone evicts a tab that holds too much, and desktop memory
      # cannot show it): the older cases per output pixel, the 40 to 61 MP
      # ones in megabytes, and a sheet twice as tall at the same width may
      # hold at most 1.15 times as much. The 61 MP worst press (case 8) runs
      # with FULL=1.
      - run: node scripts/measure-alloc.mjs
      # Save keeps every pixel of the photo: the real import and the real
      # savePrint on zone plates up to 61 MP, compared with the original,
      # and the 40 and 61 MP ones saved again as a JPEG whose header must say
      # 4:4:4; it fails under a gate. Then the save flow in the built app,
      # tapped: the size Save and the More sheet promised, the smaller-copy
      # question, a killed save, a 40 MP photo saved at its own pixels.
      - run: node scripts/measure-fidelity.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - run: node scripts/check-save.mjs
        env:
          PAGES: '1' # serve dist/ at the base it was built for
          CHROMIUM_PATH: /usr/bin/google-chrome
      # Tap-to-select, touched: a tap picks the plate under it without moving
      # it, and the drag it starts moves that plate, not the one selected
      # when the finger went down.
      - run: node scripts/check-touch.mjs
        env:
          PAGES: '1'
          CHROMIUM_PATH: /usr/bin/google-chrome
      # The preview is a true picture of the print: every harness document
      # through the preview's entry point and the export's, at one height,
      # must give the same bytes; the file Save writes (a PNG) decodes to the
      # export's canvas; and a save whose memory runs out once, at set-up or
      # mid-press, writes the same file (it fails if any differs).
      - run: node scripts/harness/run.mjs --out "$RUNNER_TEMP/parity.json" --no-hashes --parity 1000 --file-parity 1000 --retry
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      # The whole chain in Frosted: a photo imported, its palette stored,
      # its frame made from it as Save makes it; the preview, the export and
      # the file Save writes give the same bytes (it fails if not).
      - run: node scripts/harness/run.mjs --out "$RUNNER_TEMP/chain.json" --no-hashes --chain
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      # The frame's cost in the preview: framed renders (Crop, Fit and
      # Frosted, settled and draft) against the same print unframed and
      # against their own compose skipped, at most 1.10x settled and 1.25x
      # draft; Frosted with its field made again within its own bound. A
      # shared runner's slow spells are measured again, up to twice, before
      # a row fails (README "The frame is ground").
      - run: node scripts/harness/run.mjs --out "$RUNNER_TEMP/frame-cost.json" --no-hashes --frame-cost
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      # The device spike (scripts/device-spike/spike.html), the page a phone
      # runs before the native-resolution save is built on it: it still
      # loads, runs every test and prints its table, asking for nothing but
      # itself.
      - run: node scripts/check-spike.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      # The save's own encoders, decoded by the browser: the JPEG's error on
      # a gradient, a saturated halftone and a real print, against bounds and
      # against Chromium's own 4:2:0 JPEG, every frame 4:4:4; the PNG,
      # compressed and stored, the input exactly.
      - run: node scripts/check-encode.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      # The band engine on real glyphs and a real photo, through the export's
      # entry point: the same bytes at every band height on forced small
      # tiles, the type's tile seams inside their bounds, and type over the
      # canvas's font cap keeping its advances.
      - run: node scripts/check-bands.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      # The frame against Border Studio's own (frozen at 597ce7a in
      # scripts/parity-borders/; the Borders repo is never fetched): the
      # sheet, the border and the matte, the photo, the corners and Frosted,
      # each within the bound the script states.
      - run: node scripts/parity-borders.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      # Time and resident memory of an export in desktop Chrome, 12 to 81 MP,
      # the framed 58 and 81 MP sheets among them, each save's time a sheet
      # megapixel beside the device spike's estimate for a phone.
      # Informational: V8 frees what JavaScriptCore keeps, so measure-alloc
      # is the gate.
      - run: node scripts/measure-export.mjs
        continue-on-error: true
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome

      # Hand the *verified* build to the deploy job rather than rebuilding it
      # there. Whatever ships is then byte-for-byte what the gate checked.
      - name: Upload built site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 1

  deploy:
    needs: verify # the gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Vite emits an assets/ directory; Jekyll would also swallow any
          # future underscore-prefixed file. Disabling it writes .nojekyll.
          enable_jekyll: false
