<!doctype html>
<!-- The style guide's `default` palette: true neutral grey, chroma 0. The
     app's job is judging ink and stock colour, and tinted chrome shifts how
     the inks read, so no palette with a hue (README, "Design system"). -->
<html lang="en" data-palette="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- The one job, in the host ruling's words; the manifest's description
         (vite.config.ts) says the same. -->
    <meta name="description" content="Frame a photo and put risographic text on it, saved at the photo's own full resolution." />

    <!-- Must match manifest theme_color in vite.config.ts (playbook §3.1). Both
         are the style guide's --canvas in the `default` palette, resolved in a
         browser (light / dark). Change them together with data-palette. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F5F5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E0E0E" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Print" />
    <!-- `default`, not `black-translucent`: the top of this app is light gray in
         light mode, and black-translucent forces light status-bar text (§3.4). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>Print Machine</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- The style guide's layout scripts (src/vendor/styleguide/VERSION.md):
         core (SG.fit), the segmented control's fit, the toolbar's pages. Plain
         scripts by design, so not part of the bundle. ROOT-ABSOLUTE paths:
         Vite rewrites them with the build's base (/PrintMachine/ on Pages, /
         in development); a hard-coded /PrintMachine/ breaks the other. -->
    <script src="/sg/core.min.js" defer></script>
    <script src="/sg/js/44-segmented.min.js" defer></script>
    <!-- 70-scrubber defines SG.afterParse, which 71-toolbar needs and the style
         guide's dist/elements/manifest.json does not list. Inert without
         .scrubber elements. -->
    <script src="/sg/js/70-scrubber.min.js" defer></script>
    <script src="/sg/js/71-toolbar.min.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
